<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Red logo mark: the INACAP I-beam symbol -->
  <rect x="0" y="0" width="60" height="60" fill="#ED1C24"/>
  <!-- White I cutout: top horizontal bar -->
  <rect x="7" y="7"  width="46" height="12" fill="white"/>
  <!-- White I cutout: bottom horizontal bar -->
  <rect x="7" y="41" width="46" height="12" fill="white"/>
  <!-- White I cutout: left vertical space -->
  <rect x="7" y="19" width="15" height="22" fill="white"/>
  <!-- White I cutout: right vertical space -->
  <rect x="38" y="19" width="15" height="22" fill="white"/>
  <!-- "inacap" bold text -->
  <text x="68" y="44"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="32"
        fill="#231f20"
        letter-spacing="-0.5">inacap</text>
</svg>
